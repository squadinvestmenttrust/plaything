<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Disclosure</title>
    
    <!-- Fonts: Inter for UI, JetBrains Mono for Tickers & Numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        black: '#050505',
                        surface: '#111113',
                        borderSubtle: '#222225',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- PapaParse for robust CSV processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            /* Subtle grid background to look technical */
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505; 
        }
        ::-webkit-scrollbar-thumb {
            background: #222225; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333; 
        }

        /* Heatmap Grid Setup */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .heatmap-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 12px;
            }
        }

        /* Heatmap Cell Base */
        .heatmap-cell {
            aspect-ratio: 1 / 1;
            opacity: 0; /* Handled by JS animation */
            will-change: transform, opacity;
        }

        /* Ambient Glow effect behind main container */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 400px;
            background: radial-gradient(circle, rgba(50,50,80,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="antialiased min-h-screen relative pb-20">

    <div class="ambient-glow"></div>

    <main class="max-w-6xl mx-auto px-6 pt-16 sm:pt-24 relative z-10">
        
        <!-- Header Section -->
        <header class="mb-16 text-left animate-slide-up">
            <div class="space-y-4 max-w-2xl">
                <h1 class="text-4xl sm:text-5xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-500">
                    Portfolio
                </h1>
                <!-- H1 Intro Text Target -->
                <p id="intro-text" class="text-gray-400 text-sm sm:text-base leading-relaxed max-w-xl">
                    <!-- Loaded via JS -->
                    <span class="inline-block w-48 h-4 bg-surface rounded animate-pulse"></span>
                    <span class="inline-block w-32 h-4 bg-surface rounded animate-pulse"></span>
                </p>
            </div>
        </header>

        <!-- Loading Skeleton -->
        <div id="loading-state" class="space-y-16">
            <div class="space-y-6">
                <div class="h-8 w-48 bg-surface rounded animate-pulse"></div>
                <div class="heatmap-grid">
                    <div class="bg-surface aspect-square rounded-xl animate-pulse"></div>
                    <div class="bg-surface aspect-square rounded-xl animate-pulse"></div>
                    <div class="bg-surface aspect-square rounded-xl animate-pulse"></div>
                    <div class="bg-surface aspect-square rounded-xl animate-pulse"></div>
                    <div class="bg-surface aspect-square rounded-xl animate-pulse"></div>
                    <div class="bg-surface aspect-square rounded-xl animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- Content Container (Hidden initially) -->
        <div id="content-container" class="space-y-16 hidden">
            
            <!-- Direct Holdings Section -->
            <section>
                <div class="flex items-center justify-between mb-6 border-b border-borderSubtle pb-4">
                    <h2 class="text-2xl font-semibold tracking-tight text-white/90">Direct Holdings</h2>
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface border border-borderSubtle text-xs font-mono text-gray-400 uppercase tracking-widest shadow-sm">
                        <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                        20 Minute Delayed Data
                    </div>
                </div>
                <div id="direct-grid" class="heatmap-grid">
                    <!-- Cells injected by JS -->
                </div>
            </section>

            <!-- Funds Section -->
            <section>
                <div class="flex items-center justify-between mb-6 border-b border-borderSubtle pb-4">
                    <h2 class="text-2xl font-semibold tracking-tight text-white/90">Funds</h2>
                </div>
                <div id="funds-grid" class="heatmap-grid">
                    <!-- Cells injected by JS -->
                </div>
            </section>
        </div>

        <!-- Small Print Disclosure -->
        <footer class="mt-16 pt-8 border-t border-borderSubtle">
            <p id="footer-disclosure" class="text-[11px] leading-relaxed text-gray-500 text-left">
                <!-- Loaded via JS -->
            </p>
        </footer>

    </main>

    <script>
        // Data source provided by user
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYFqhdIu5rvsNMTXkwdTJ4LYbmh8p5nfqok0-EVVi271sbRzoFUVAZpRT3W1vE6ehLxSS4tGyO2C0h/pub?output=csv";

        // Format Date to "10 Sep 2026"
        function formatDate(dateStr) {
            if (!dateStr || dateStr === "N/A") return dateStr;
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr; // fallback if invalid
            
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        // Performance color interpolator based on daily percentage (-5% to +5% standard bounds)
        function getPerformanceColor(perfRaw) {
            const clampValue = Math.max(-5, Math.min(5, perfRaw));
            
            if (clampValue > 0) {
                // Interpolate 0 to 5 -> Green shades
                const intensity = clampValue / 5;
                // Dark green to Bright robinhood green (#0ecb81)
                const r = Math.round(15 + (14 - 15) * intensity);
                const g = Math.round(45 + (203 - 45) * intensity);
                const b = Math.round(30 + (129 - 30) * intensity);
                return `rgb(${r}, ${g}, ${b})`;
            } else if (clampValue < 0) {
                // Interpolate 0 to -5 -> Red shades
                const intensity = Math.abs(clampValue) / 5;
                // Dark red to Bright red (#f6465d)
                const r = Math.round(50 + (246 - 50) * intensity);
                const g = Math.round(15 + (70 - 15) * intensity);
                const b = Math.round(20 + (93 - 20) * intensity);
                return `rgb(${r}, ${g}, ${b})`;
            }
            
            // Neutral for exactly 0%
            return '#181a20'; 
        }

        // Parse performance strings intelligently (e.g. "1.5%", "0.015", "-2.1%")
        function parsePerformance(val) {
            if (!val || typeof val !== 'string') return { raw: 0, text: "0.00%", class: "text-gray-400" };
            
            // If the cell contains non-numerical status text or date strings, default to 0
            const cleaned = val.replace(/[^0-9.-]/g, '');
            let num = parseFloat(cleaned);
            if (isNaN(num)) num = 0;

            // Optional: If you export purely decimals (e.g., 0.015) vs percentages (1.5%)
            // Assuming the CSV contains standard formatted percentages if they have a % sign.
            if (!val.includes('%') && num < 1 && num > -1 && num !== 0 && val.includes('.')) {
                // It MIGHT be a raw decimal, but let's trust the strict parser: we just show what we parse.
                // We will treat it as the exact face value just in case.
            }

            const prefix = num > 0 ? "+" : "";
            const text = `${prefix}${num.toFixed(2)}%`;
            let textColorClass = "text-gray-300";
            if (num > 0) textColorClass = "text-green-400";
            if (num < 0) textColorClass = "text-red-400";

            return { raw: num, text: text, class: textColorClass };
        }

        function createHeatmapCell(item, index) {
            const cell = document.createElement('div');
            const bgColor = getPerformanceColor(item.perf.raw);
            
            // Setup the container with transitions and tabindex for accessibility/mobile taps
            cell.className = `heatmap-cell group relative w-full overflow-hidden rounded-xl cursor-pointer shadow-[0_4px_12px_rgba(0,0,0,0.5)] border border-white/5 transition-transform hover:scale-[1.03] hover:z-10 focus:outline-none focus:ring-2 focus:ring-white/20`;
            cell.style.backgroundColor = bgColor;
            cell.style.animation = `slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 20}ms`;
            cell.tabIndex = 0;

            // Default State (Ticker)
            const defaultState = document.createElement('div');
            defaultState.className = `absolute inset-0 flex items-center justify-center transition-opacity duration-300 group-hover:opacity-0 group-focus:opacity-0`;
            defaultState.innerHTML = `<span class="font-mono text-base sm:text-lg font-bold tracking-tight text-white/95 drop-shadow-md">${item.ticker}</span>`;

            // Hover/Focus State (Name + Percentage)
            const hoverState = document.createElement('div');
            hoverState.className = `absolute inset-0 flex flex-col items-center justify-center p-2 text-center opacity-0 transition-opacity duration-300 group-hover:opacity-100 group-focus:opacity-100 bg-black/60 backdrop-blur-[2px]`;
            hoverState.innerHTML = `
                <span class="text-[10px] sm:text-xs font-medium text-gray-100 line-clamp-2 leading-tight mb-1 drop-shadow-md">${item.name}</span>
                <div class="flex flex-col items-center mt-1">
                    <span class="text-[8px] sm:text-[9px] text-gray-400/90 uppercase tracking-widest leading-none mb-0.5">Daily Change</span>
                    <span class="font-mono text-xs sm:text-sm font-bold drop-shadow-md ${item.perf.class}">${item.perf.text}</span>
                </div>
            `;

            cell.appendChild(defaultState);
            cell.appendChild(hoverState);
            return cell;
        }

        async function fetchAndProcessData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    skipEmptyLines: true,
                    complete: function(results) {
                        const data = results.data;
                        if (!data || data.length === 0) throw new Error("Empty CSV data");

                        // Extract single-cell values as requested
                        // Intro text: H1 (Row 0, Col 7)
                        const introText = (data[0] && data[0][7]) ? data[0][7] : "Overview of my active investment portfolio and asset allocations.";
                        
                        // Last Updated: F2 (Row 1, Col 5)
                        const rawLastUpdated = (data[1] && data[1][5]) ? data[1][5] : "N/A";
                        const lastUpdated = formatDate(rawLastUpdated);

                        // Small Print Disclosure: H3 (Row 2, Col 7)
                        const footerText = (data[2] && data[2][7]) ? data[2][7] : "";

                        const directHoldings = [];
                        const funds = [];

                        // Process rows (assuming row 0 might be headers, we start processing at row 1)
                        // If row 1 contains actual data, it gets picked up. If D/E/F are headers in row 0, we skip row 0.
                        for (let i = 1; i < data.length; i++) {
                            const row = data[i];

                            // Direct Holdings: Col A(0) Ticker, Col B(1) Name, Col C(2) Performance
                            if (row[0] && row[0].trim() !== "" && row[0].trim().toLowerCase() !== "ticker") {
                                directHoldings.push({
                                    ticker: row[0].trim(),
                                    name: row[1] ? row[1].trim() : "Unknown",
                                    perf: parsePerformance(row[2])
                                });
                            }

                            // Funds: Col D(3) Ticker, Col E(4) Name, Col F(5) Performance
                            // Note: F2 contains the date. If i=1, row[5] is the date string.
                            // parsePerformance safely handles date strings by returning 0%.
                            if (row[3] && row[3].trim() !== "" && row[3].trim().toLowerCase() !== "ticker") {
                                funds.push({
                                    ticker: row[3].trim(),
                                    name: row[4] ? row[4].trim() : "Unknown",
                                    perf: parsePerformance(row[5])
                                });
                            }
                        }

                        renderUI(introText, lastUpdated, footerText, directHoldings, funds);
                    },
                    error: function(err) {
                        showError("Failed to parse the data source.");
                        console.error(err);
                    }
                });
            } catch (err) {
                showError("Failed to connect to the disclosure source.");
                console.error(err);
            }
        }

        function renderUI(intro, dateText, footer, direct, funds) {
            // Update Headers
            document.getElementById('intro-text').innerText = intro;
            
            // Update Footer
            document.getElementById('footer-disclosure').innerText = footer;
            
            // Render Grids
            const directGrid = document.getElementById('direct-grid');
            const fundsGrid = document.getElementById('funds-grid');
            
            directGrid.innerHTML = '';
            fundsGrid.innerHTML = '';

            direct.forEach((item, index) => {
                directGrid.appendChild(createHeatmapCell(item, index));
            });

            funds.forEach((item, index) => {
                fundsGrid.appendChild(createHeatmapCell(item, index));
            });

            // Transition UI States
            document.getElementById('loading-state').classList.add('hidden');
            const content = document.getElementById('content-container');
            content.classList.remove('hidden');
            content.classList.add('animate-fade-in');
        }

        function showError(msg) {
            document.getElementById('intro-text').innerHTML = `<span class="text-red-400 border border-red-400/20 bg-red-400/10 px-3 py-1 rounded">Error: ${msg}</span>`;
            document.getElementById('loading-state').innerHTML = `<p class="text-gray-500 italic px-4">The heatmap data is currently unavailable. Please verify the Google Sheets URL.</p>`;
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            fetchAndProcessData();
        });
    </script>
</body>
</html>
